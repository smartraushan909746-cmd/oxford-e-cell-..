<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10 Photo Slider</title>
    <style>
        /* Basic styling */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
            margin: 0;
        }

        .slider-container {
            position: relative;
            width: 600px; /* Aap ise apne hisaab se chota/bada kar sakte hain */
            height: 400px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            background: white;
        }

        .slider-wrapper {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 100%;
        }

        .slider-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Photo ko stretch hone se bachata hai */
            flex-shrink: 0;
        }

        /* Buttons styling */
        .btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 18px;
            border-radius: 5px;
            z-index: 10;
        }

        .btn:hover {
            background-color: rgba(0, 0, 0, 0.8);
        }

        .prev-btn {
            left: 10px;
        }

        .next-btn {
            right: 10px;
        }
    </style>
</head>
<body>

    <div class="slider-container">
        <!-- Prev/Next Buttons -->
        <button class="btn prev-btn" onclick="moveSlide(-1)">&#10094;</button>
        <button class="btn next-btn" onclick="moveSlide(1)">&#10095;</button>

        <!-- Photos Wrapper -->
        <div class="slider-wrapper" id="slider">
            <!-- Yahan 10 photos daalein. Filhal maine placeholder image URL use kiye hain. 
                 Aap src="" mein apni photos ka path daal sakte hain (e.g., images/photo1.jpg) -->
            <img src="https://drive.google.com/file/d/1cDSFHpL2sDqMBFTI91xkh6d9NwlGWBbI/view?usp=drivesdk" alt="Photo 1">
            <img src="https://picsum.photos/id/1016/600/400" alt="Photo 2">
            <img src="https://picsum.photos/id/1018/600/400" alt="Photo 3">
            <img src="https://picsum.photos/id/1019/600/400" alt="Photo 4">
            <img src="https://picsum.photos/id/1020/600/400" alt="Photo 5">
            <img src="https://picsum.photos/id/1021/600/400" alt="Photo 6">
            <img src="https://picsum.photos/id/1022/600/400" alt="Photo 7">
            <img src="https://picsum.photos/id/1023/600/400" alt="Photo 8">
            <img src="https://picsum.photos/id/1024/600/400" alt="Photo 9">
            <img src="https://picsum.photos/id/1025/600/400" alt="Photo 10">
        </div>
    </div>

    <script>
        let currentIndex = 0;
        const slider = document.getElementById('slider');
        const totalImages = slider.children.length; // Yeh automatically 10 count karega

        function moveSlide(direction) {
            currentIndex += direction;

            // Agar aage badhne par 10 se zyada ho jaye, to wapas 0 (pehli photo) par le aao
            if (currentIndex >= totalImages) {
                currentIndex = 0;
            }
            
            // Agar peeche jaane par -1 ho jaye, to last photo (9th index) par le aao
            if (currentIndex < 0) {
                currentIndex = totalImages - 1;
            }

            // Slider ko shift karo
            slider.style.transform = translateX(-${currentIndex * 100}%);
        }

        // (Optional) Automatic slider - Har 3 second mein apne aap badle
        // Agar automatic nahi chahiye to neeche wali 2 lines hata dein
        setInterval(() => {
            moveSlide(1);
        }, 3000); 
    </script>

</body>
</html>
